services:
  db:
    image: postgres:18
    container_name: delez-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delez}
      POSTGRES_DB: ${POSTGRES_DB:-delez}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
